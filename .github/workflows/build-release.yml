name: Build & Release

# 用 GitHub Actions 在三个平台自动构建 Electron 应用；推送 v* 标签时把产物
# 发布到 GitHub Release（标记为 prerelease，见 package.json 的 build.publish.releaseType；
# 不能停在 draft —— electron-updater 读不到草稿，会导致自动更新永久失效）。
# 对应 samuelmeuli/action-electron-builder 的用途，但使用官方 runners + electron-builder
# 直接发布（该旧 action 已停更，且其 node-version:10 无法安装本项目 Electron 44）。

on:
  push:
    # 只在 main 分支与版本标签上构建（dev/alpha 不再触发，避免无谓的三平台打包）。
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 允许用默认 GITHUB_TOKEN 创建 GitHub Release

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    env:
      # 无证书时跳过代码签名尝试（否则 mac/linux 无证书会失败）。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # electron-builder 发布到 GitHub 所需的令牌（GitHub Actions 自动注入）。
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # 标签必须与 package.json 的 version 一致：electron-builder 用 version 生成 release 的
      # tag，不一致会把产物发到与代码不匹配的 Release，更新器也就找不到对应版本。
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json ${expected}"
            exit 1
          fi

      - name: Compile the app (electron-vite build)
        run: npm run build

      # 仅当推送的是 v* 标签时才发布（生成 prerelease，供下载；必须是已发布状态）。
      - name: Package & publish to GitHub Release (tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --publish always

      # 普通 push / PR / 手动触发：只打包验证，不发布。
      - name: Package without publishing (non-tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --publish never

      - name: Upload artifacts (non-tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.AppImage
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: warn
